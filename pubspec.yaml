name: mypresensi_flutter_stage3
version: 1.0.0+1
publish_to: "none"
description: MyPresensi - Firebase RTDB, Leaflet map, camera attendance, QR, history, profile.

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.6
  firebase_storage: ^12.3.6
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  intl: ^0.20.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps.html
    - assets/images/
