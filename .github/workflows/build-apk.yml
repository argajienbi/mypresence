name: Build APK (debug)

# Otomatis jalan setiap push ke branch ini, atau manual via tombol "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [ "uti/firebase-mypresence-prod" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mypresence-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
