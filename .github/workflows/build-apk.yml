name: Build APK (debug)

# Otomatis jalan setiap push ke branch ini, atau manual via tombol "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [ "uti/firebase-mypresence-prod", "uti/redesign-myadmin" 
    jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define=R2_ENDPOINT=${{ secrets.R2_ENDPOINT }} --dart-define=R2_BUCKET=${{ secrets.R2_BUCKET }} --dart-define=R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }} --dart-define=R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }} --dart-define=R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mypresence-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
